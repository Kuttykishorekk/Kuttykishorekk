<svg width="100%" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stage Bloom / Glow Filter for Crisp Neon Look -->
    <filter id="developerGlow" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feGaussianBlur stdDeviation="6" result="ambientGlow"/>
      <feMerge>
        <feMergeNode in="ambientGlow"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear/Raycast Style Developer Base Track -->
    <linearGradient id="devTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.04"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Forward Laser Beam Gradient (Cyan -> Violet -> White Core) -->
    <linearGradient id="forwardBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Reverse Energy Particle Gradient (Pink -> Indigo -> White Core) -->
    <linearGradient id="reverseBeam" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="55%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Hairline Base Track -->
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#devTrack)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle Micro Ticks at Center & Edges for Tech Authenticity -->
  <circle cx="20" cy="12" r="1.5" fill="#00f5d4" opacity="0.3"/>
  <circle cx="600" cy="12" r="2" fill="#818cf8" opacity="0.5"/>
  <circle cx="1180" cy="12" r="1.5" fill="#f43f5e" opacity="0.3"/>

  <!-- Primary Traveling Photon Pulse (Left to Right) -->
  <g filter="url(#developerGlow)">
    <!-- Sleek Streamline Tail -->
    <line x1="-160" y1="12" x2="0" y2="12" stroke="url(#forwardBeam)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-180 0; 1380 0" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Pure White Luminous Core -->
    <circle cx="0" cy="12" r="3" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="-180 0; 1380 0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Cyan Energy Aura -->
    <circle cx="0" cy="12" r="5.5" fill="#00f5d4" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="-180 0; 1380 0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;6.5;4.5" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Secondary Counter-Flow Pulse (Right to Left, Smooth Offset) -->
  <g filter="url(#developerGlow)">
    <!-- Streamline Tail -->
    <line x1="0" y1="12" x2="140" y2="12" stroke="url(#reverseBeam)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="1380 0; -180 0" dur="4.2s" begin="1.1s" repeatCount="indefinite"/>
    </line>
    <!-- Luminous Core -->
    <circle cx="0" cy="12" r="2.5" fill="#ffffff">
      <animateTransform attributeName="transform" type="translate" values="1380 0; -180 0" dur="4.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <!-- Violet/Pink Energy Aura -->
    <circle cx="0" cy="12" r="5" fill="#c084fc" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="1380 0; -180 0" dur="4.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>